<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!-- Spectrum's own ramps, resolved to literal colours at `npm run setup` and
       keyed on .spectrum--light / .spectrum--dark, which src/ui/theme.js stamps
       on the body element. Generated, gitignored; see scripts/spectrum-theme.mjs.
       It must come first so panel.css can consume the --ui-* it declares. -->
  <link rel="stylesheet" href="vendor/spectrum-theme.css">
  <link rel="stylesheet" href="src/ui/panel.css">
</head>

<body>
  <div class="panel">
    <!-- The controls wrap inside their own box so that the gear stays pinned to
         the top right instead of being pushed onto a row of its own. -->
    <div class="toolbar">
      <div class="controls">
        <label class="field">
          <sp-label>Style</sp-label>
          <select id="mode">
            <option value="inline">Inline</option>
            <option value="display">Display</option>
          </select>
        </label>
        <label class="field">
          <sp-label>Size</sp-label>
          <select id="size-mode">
            <option value="auto">Match text</option>
            <option value="fixed">Fixed</option>
          </select>
        </label>
        <input type="number" id="size-pt" min="1" max="600" step="0.5" value="10" title="Point size" disabled>
        <label class="field">
          <sp-label>Colour</sp-label>
          <select id="color-mode">
            <option value="auto">Match text</option>
            <option value="black">Black</option>
          </select>
        </label>
      </div>
      <button id="settings-toggle" class="icon" title="Settings">&#9881;</button>
    </div>

    <!-- Tabs rather than a drawer: the preamble needs the live preview below it
         just as much as the equation does, and the drawer this replaced was a
         sibling in this flex column, so opening it halved the webview.

         Spans, not buttons: UXP gives a <button> a native pill appearance that
         ignores background/border, so tabs built from buttons read as buttons
         with a stray underline. -->
    <div class="tabs">
      <span id="tab-equation" class="tab active">Equation</span>
      <span id="tab-preamble" class="tab">Preamble<span id="preamble-dot" class="dot hidden">&#9679;</span></span>
    </div>

    <!-- One editor serves both tabs, swapping its contents. Two of them, with
         the inactive one display:none, left the preamble unfocusable: a UXP
         textarea that spends its life inside a hidden subtree never becomes
         editable. One always-visible control cannot hit that.

         sp-textarea, the native Spectrum widget, chosen over a plain <textarea>
         so the control themes itself and draws its own caret. The cost is that
         it renders into a *closed* shadow root, so nothing inside it can be
         styled — a monospace face for the Typst source is not available at any
         price. Reading and writing goes through the helpers in panel.js so that
         swapping the widget is one change. -->
    <!-- The editor and the preview share whatever height is left over, on a
         fixed ratio. Before this box existed the editor was a hard 84px and the
         preview took everything else, so making the panel taller only ever grew
         the preview. -->
    <div class="workspace">
      <sp-textarea id="editor" placeholder="Typst math, e.g.  sum_(i=1)^n x_i / 2"></sp-textarea>

      <div id="preamble-actions" class="row hidden">
        <button id="preamble-save-default" title="Use this preamble for new documents">Save as default</button>
        <button id="preamble-reset-default" title="Replace this document's preamble with your default">Reset to
          default</button>
      </div>
      <span id="preamble-hint" class="hint"></span>

      <!-- Local content must be addressed with the plugin: protocol; a relative
           path silently loads nothing. Needs requiredPermissions.webview
           .allowLocalRendering = "yes" (UXP 8+; InDesign 21.4 ships UXP 9.3). -->
      <webview id="preview" src="plugin:/webview/index.html" height="100%" width="100%"
        uxpAllowInspector="true"></webview>
    </div>

    <!-- Its own full-width row: a compiler error runs to several lines and is
         unreadable squeezed beside the buttons. -->
    <div id="status" class="status"></div>
    <div class="statusbar">
      <span class="spacer"></span>
      <button id="revert" class="secondary hidden">Revert</button>
      <button id="insert" class="cta" disabled>Insert</button>
    </div>
  </div>

  <!-- Both dialogs must be in the DOM before showModal(); UXP throws on a
       detached element, and neither is removed on close, so they are reused.
       Note that UXP remembers a dialog's geometry against its id — if a size
       change appears to do nothing, change the id. -->
  <!-- Label and hint each get their own line. Relying on `gap` to separate them
       side by side ran them together into "FontsAdded to the compiler…" — UXP
       supports only part of flexbox, and a narrow dialog wants the stacked form
       anyway. -->
  <dialog id="settings-dialog-3">
    <div class="dlg">
      <!-- Everything above the footer scrolls; Done stays put. Without this the
           dialog could be dragged taller and simply grew empty space under the
           button, because .dlg stated a width and no height. -->
      <div class="dlg-body">
      <div class="section">
        <sp-detail class="section-title">Fonts</sp-detail>
        <span class="hint">Handed to the compiler alongside the Typst defaults. Changing them rebuilds it, which
          takes a few seconds.</span>
        <ul id="dlg-font-list" class="font-list"></ul>
        <div class="row">
          <button id="dlg-add-fonts">Add font files&hellip;</button>
          <button id="dlg-clear-fonts">Clear</button>
        </div>
      </div>

      <!-- The one section that takes the spare height: a code editor is the
           thing you would want the room in, and the font list beside it looks
           wrong holding a big empty gap when no fonts are installed. Its
           min-height forces the body to scroll rather than being crushed when
           the dialog is short. -->
      <div class="section grows">
        <sp-detail class="section-title">Default preamble</sp-detail>
        <span class="hint">Seeds any document that has none.</span>
        <sp-textarea id="dlg-default-preamble"
          placeholder="#let vb(x) = math.bold(x)"></sp-textarea>
      </div>

      <div class="section">
        <sp-detail class="section-title">New equations start as</sp-detail>
        <div class="row">
          <label class="field">
            <sp-label>Style</sp-label>
            <select id="dlg-mode">
              <option value="inline">Inline</option>
              <option value="display">Display</option>
            </select>
          </label>
          <label class="field">
            <sp-label>Colour</sp-label>
            <select id="dlg-color-mode">
              <option value="auto">Match text</option>
              <option value="black">Black</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="field">
            <sp-label>Size</sp-label>
            <select id="dlg-size-mode">
              <option value="auto">Match text</option>
              <option value="fixed">Fixed</option>
            </select>
          </label>
          <input type="number" id="dlg-size-pt" min="1" max="600" step="0.5" value="10" title="Point size">
        </div>
      </div>

      <div class="section">
        <span id="dlg-engine" class="hint"></span>
        <!-- Its own readout: the dialog covers the panel's status line, and both
             the file picker and the compiler rebuild happen from here. -->
        <div id="dlg-status" class="status"></div>
      </div>
      </div>

      <div class="row dlg-footer">
        <span class="spacer"></span>
        <button id="dlg-done" class="cta">Done</button>
      </div>
    </div>
  </dialog>

  <dialog id="message-dialog-2">
    <div class="dlg">
      <div class="dlg-body">
        <div id="msg-text" class="status"></div>
      </div>
      <div class="row dlg-footer">
        <span class="spacer"></span>
        <button id="msg-ok" class="cta">OK</button>
      </div>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>

</html>
